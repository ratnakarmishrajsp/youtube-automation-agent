name: Instagram Reels Cloud Auto-Publisher

on:
  schedule:
    # GitHub only fires scheduled runs a few times a day in practice, so the
    # scheduler itself waits (up to 5 h) for the next reel and publishes on time.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two publishers at once (a waiting run keeps the slot; newer ones queue).
concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Latest master, not the commit that was current when this run was queued.
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Instagram Auto-Scheduler
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: node scripts/instagram-auto-scheduler.js --wait-window 300

      - name: Commit & Push Queue Changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Record-by-record JSON merge with whatever the laptop pushed meanwhile (no git conflicts).
          node -e "require('./scripts/lib/queue-sync').syncAndPush('chore: update instagram reels queue [skip ci]')"
